server:
  port: 8080
  servlet:
    context-path: /api
cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://<your_api_key>:<your_api_secret>@<your_cloud_name>}

spring:
  datasource:
    url: ${DBMS_CONNECTION_URL:jdbc:mysql://<your_db_host>:<your_db_port>/<your_db_name>}
    username: ${DBMS_USERNAME:<your_db_username>}
    password: ${DBMS_PASSWORD:<your_db_password>}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
#    defer-datasource-initialization: true
